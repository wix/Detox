  - wait
  - label: ":ios: Package iOS"
    key: 'ios_package'
    command:
      - "nvm install"
      - "npm run package:ios"
    artifact_paths: "/Users/builder/uibuilder/work/detox/*.tbz"

  # Android is disabled on the v21 alpha branch, as in pipeline_common.sh: the
  # gradle publish would take the agent for half an hour to produce an AAR the
  # alpha cannot use, and Publish would sit behind it. The release script
  # tolerates the missing artifacts (see getPackagesFromPreviousBuilds).
  # - label: ":android: Package android"
  #   key: 'android_package'
  #   command:
  #     - "nvm install"
  #     - "./scripts/install.sh"
  #     - "npm run package:android"
  #   env:
  #     DETOX_DISABLE_POSTINSTALL: true
  #     DETOX_DISABLE_POD_INSTALL: true
  #     JAVA_HOME: /opt/openjdk/openlogic-openjdk-17.0.9+9-mac-x64/jdk-17.0.9.jdk/Contents/Home
  #   artifact_paths: "/Users/builder/uibuilder/work/detox/Detox-android/**/*"

  - label: ":shipit: Publish"
    depends_on:
      - 'ios_package'
    command:
      # `nvm install` (bare) honours .nvmrc — node 24, which is what the repo's
      # own `engines` pin (">=24 <25") and the esbuild target require. The
      # hardcoded `nvm install 20` this replaced predates that pin.
      - "nvm install"
      - "./scripts/install.sh"
      - "npm run release"
    env:
      DETOX_DISABLE_POD_INSTALL: true
      DETOX_DISABLE_POSTINSTALL: true
