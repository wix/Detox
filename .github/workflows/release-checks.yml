name: Release checks

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/release*.yml'
      - '.github/actions/build-release-packages/**'
      - 'scripts/release/**'
  push:
    branches: [master]
    paths:
      - '.github/workflows/release*.yml'
      - '.github/actions/build-release-packages/**'
      - 'scripts/release/**'

permissions:
  contents: read

jobs:
  release-helpers:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
        with:
          persist-credentials: false
      - uses: actions/setup-node@65d868f8d4d85d7d4abb7de0875cde3fcc8798f5
        with:
          node-version: '24.22.1'
          package-manager-cache: false
      # Packing needs the macOS-built native artifacts; the Release prepare check covers it.
      - name: Test release authorization and recovery
        run: node --test scripts/release/*.test.cjs
