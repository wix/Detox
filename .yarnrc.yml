compressionLevel: mixed

enableGlobalCache: false

# Workspaces are not hoisted: each one keeps its own node_modules, which is
# what the React Native apps need — Metro and CocoaPods resolve per app, and
# scripts/change_all_react_native_versions.sh rewrites the React Native version
# workspace by workspace before reinstalling.
#
# The consequence reaches past the apps: being a workspace does NOT put a
# package in the root node_modules. Anything the built code imports BY NAME at
# runtime — a Detox driver package, say — must be a dependency of something on
# Node's resolution walk, or it is unresolvable at run time while every static
# check stays green. Pinned by
# packages/server/src/__tests__/driver-resolution.contract.test.ts.
nmHoistingLimits: workspaces

nmMode: hardlinks-local

nodeLinker: node-modules

npmMinimalAgeGate: 14d
